name: Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dms_collection_delete_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dms_collection_delete_test
      COLLECTION_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dms_collection_delete_test
      JWT_SECRET: ci-jwt-secret-with-at-least-32-characters
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare disposable database and Prisma client
        run: |
          npx prisma migrate deploy
          npx prisma generate

      - name: Run quality gate
        run: npm run quality
